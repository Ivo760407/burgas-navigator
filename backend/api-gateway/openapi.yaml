swagger: '2.0'
info:
  title: Burgas Navigator TTS API
  version: '1.0'
schemes:
  - https
produces:
  - application/json
paths:
  /health:
    get:
      operationId: health
      x-google-backend:
        address: CLOUD_RUN_URL
      responses:
        '200':
          description: OK
  /tts:
    post:
      operationId: synthesizeTts
      consumes:
        - application/json
      produces:
        - audio/mpeg
      security:
        - api_key: []
      x-google-backend:
        address: CLOUD_RUN_URL
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        '200':
          description: MP3 audio
        '400':
          description: Invalid request
        '429':
          description: Too many requests
        '502':
          description: TTS backend failure
securityDefinitions:
  api_key:
    type: apiKey
    name: key
    in: query
x-google-management:
  metrics:
    - name: tts_requests
      displayName: TTS requests
      metricKind: DELTA
      valueType: INT64
      metricLabels:
        - key: consumer_id
          description: API consumer
  quota:
    limits:
      - name: tts_per_minute
        metric: tts_requests
        unit: '1/min/{project}'
        values:
          STANDARD: 30
